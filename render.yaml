# Blueprint für Render (https://render.com) — erlaubt ein Deploy komplett per
# Browser, ohne Terminal. Nach dem Anwenden gibt es eine dauerhafte
# HTTPS-Adresse, die sich auch verschicken lässt.
#
# Hinweis zum Gratis-Tarif: der Dienst wird bei Inaktivität schlafen gelegt und
# braucht beim nächsten Aufruf etwa eine Minute zum Aufwachen.
services:
  - type: web
    name: tumblekin
    runtime: node
    plan: free
    region: frankfurt
    # Ausdrücklich dieser Zweig, NICHT der Standardzweig: auf `main` liegen
    # bisher nur 15 Minispiele, hier sind es 23. Ohne diese Zeile würde Render
    # die alte Fassung ausliefern.
    branch: claude/improve-minigames-animations-7wfix0
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # PORT wird von Render gesetzt; der Server liest ihn aus der Umgebung.
      - key: NODE_ENV
        value: production
      # Entwickler-Werkzeug bleibt in einer öffentlichen Instanz aus.
      - key: TUMBLEKIN_DEV_TOOLS
        value: "0"
