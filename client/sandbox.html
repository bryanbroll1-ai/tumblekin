<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#a8ddf5">
    <title>Tumblekin Sandbox</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light;
        font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #a8ddf5, #cdf0e2);
        color: #2b3440;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px 6px;
      }
      header h1 { margin: 0; font-size: 1.15rem; font-weight: 900; }
      header .eyebrow {
        margin: 0;
        color: #46707e;
        font-size: 0.62rem;
        font-weight: 800;
        text-transform: uppercase;
      }
      header a {
        padding: 9px 13px;
        border-radius: 12px;
        background: #ffd15c;
        box-shadow: 0 4px 0 #ba9d27;
        color: #2b3440;
        font-size: 0.75rem;
        font-weight: 900;
        text-decoration: none;
        white-space: nowrap;
      }
      #stage-wrap {
        flex: 1 1 auto;
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 4px 10px;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
        border-radius: 18px;
        box-shadow: 0 14px 36px rgba(4, 12, 14, 0.26);
        background: #9fdcf2;
        transition: width 200ms ease, height 200ms ease;
      }
      #stage.framed { border: 3px solid rgba(21, 33, 38, 0.85); }
      #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #stage-label {
        position: absolute;
        top: 8px;
        left: 10px;
        padding: 4px 9px;
        border-radius: 9px;
        background: rgba(21, 33, 38, 0.75);
        color: #fff;
        font-size: 0.62rem;
        font-weight: 800;
        pointer-events: none;
      }
      #panel {
        flex: 0 0 auto;
        max-height: 44dvh;
        overflow-y: auto;
        padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
        display: grid;
        gap: 8px;
      }
      .row-label {
        margin: 2px 2px 0;
        color: #46707e;
        font-size: 0.6rem;
        font-weight: 900;
        text-transform: uppercase;
      }
      .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        border: 0;
        cursor: pointer;
        padding: 9px 12px;
        border-radius: 12px;
        background: rgba(21, 33, 38, 0.88);
        color: #fff;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 800;
        -webkit-tap-highlight-color: transparent;
      }
      .chip:active { transform: translateY(2px); }
      .chip.active { background: #ffd15c; color: #2b3440; box-shadow: inset 0 -3px 0 #ba9d27; }
      .chip.ghost { background: rgba(255, 255, 255, 0.72); color: #2b3440; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Tumblekin · Party-Baukasten</p>
        <h1>Sandbox</h1>
      </div>
      <a href="/?dev=1">Minispiele testen →</a>
    </header>
    <div id="stage-wrap"><div id="stage"><span id="stage-label"></span></div></div>
    <div id="panel">
      <p class="row-label">Umgebung</p>
      <div class="chip-row" id="env-row"></div>
      <p class="row-label">Hindernis spawnen (antippen · „Aufräumen“ entfernt alle)</p>
      <div class="chip-row" id="obstacle-row"></div>
      <p class="row-label">Animationen (alle Figuren)</p>
      <div class="chip-row" id="anim-row"></div>
      <p class="row-label">Testspieler · Bildschirm · Tipp: In die Welt tippen schickt Spieler 1 dorthin</p>
      <div class="chip-row" id="setup-row"></div>
    </div>
    <script type="module" src="/src/sandbox/sandbox.js?v=tumblekin94"></script>
  </body>
</html>
